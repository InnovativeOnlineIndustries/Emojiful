plugins {
    id 'net.fabricmc.fabric-loom' version "${fabric_loom_version}"
    id 'idea'
}

base {
    archivesName = "${build_file_name}-Fabric-${minecraft_version}"
}

repositories {
    maven {
        url = "https://api.modrinth.com/maven"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // Expose Common as an IntelliJ/Gradle module dependency. Common sources are
    // still compiled into this loader's jar below, so this must not be packaged
    // as a second nested copy.
    implementation project(":Common")
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    implementation "maven.modrinth:midnightlib:${midnightlib_version}"
    include "maven.modrinth:midnightlib:${midnightlib_version}"
    implementation group: 'com.esotericsoftware.yamlbeans', name: 'yamlbeans', version: '1.17'
    include group: 'com.esotericsoftware.yamlbeans', name: 'yamlbeans', version: '1.17'
}

loom {
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("runClient")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("runServer")
        }
    }
    accessWidenerPath = file("${project(':Common').projectDir.path}/src/main/resources/emojifulcommon.accesswidener")
}


processResources {
    from project(":Common").sourceSets.main.resources
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.named("compileJava", JavaCompile) {
    source(project(":Common").sourceSets.main.allSource)
}

