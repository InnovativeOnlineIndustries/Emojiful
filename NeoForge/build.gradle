plugins {
    id 'net.neoforged.moddev' version "${moddev_version}"
}
apply plugin: 'java'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

base {
    archivesName = "${build_file_name}-Neoforge-${minecraft_version}"
}

neoForge {
    version = neo_version
    accessTransformers = project.files("src/main/resources/META-INF/accesstransformer.cfg")

    runs {
    // applies to all the run configs below
    configureEach {
        // Recommended logging data for a userdev environment
        // The markers can be added/remove as needed separated by commas.
        // "SCAN": For mods scan.
        // "REGISTRIES": For firing of registry events.
        // "REGISTRYDUMP": For getting the contents of all registries.
        systemProperty 'forge.logging.markers', 'REGISTRIES'

        // Recommended logging level for the console
        // You can set various levels here.
        // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
        systemProperty 'forge.logging.console.level', 'debug'
    }

    client {
        client()
        // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        server()
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        programArgument '--nogui'
    }


    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Older IntelliJ/NeoGradle project metadata invokes this task after a Gradle
// refresh. ModDevGradle renamed it to neoForgeIdeSync, so keep an alias to make
// existing checkouts refresh cleanly without requiring users to delete .idea.
tasks.register("idePostSync") {
    group = "IDE tasks"
    description = "Compatibility alias for the current NeoForge IDE synchronization task."
    dependsOn(tasks.named("neoForgeIdeSync"))
}


sourceSets.main.resources.srcDir 'src/generated/resources'


dependencies {
    implementation group: "com.esotericsoftware.yamlbeans", name: "yamlbeans", version: "1.17"
    jarJar "com.esotericsoftware.yamlbeans:yamlbeans:1.17"
    compileOnly project(":Common")
}



// NeoGradle compiles the game, but we don't want to add our common code to the game's code
Spec<Task> notNeoTask = { Task it -> !it.name.startsWith("neo") && !it.name.contains("Test") } as Spec<Task>

tasks.withType(JavaCompile).matching(notNeoTask).configureEach {
    source(project(":Common").sourceSets.main.allSource)
}

tasks.withType(Javadoc).matching(notNeoTask).configureEach {
    source(project(":Common").sourceSets.main.allJava)
}

tasks.named("sourcesJar", Jar) {
    from(project(":Common").sourceSets.main.allSource)
}

processResources {
    from project(":Common").sourceSets.main.resources
    inputs.property "version", project.version
    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version
    }
}

